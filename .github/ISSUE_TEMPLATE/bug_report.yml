name: Bug report
description: Report a reproducible script or workflow failure
title: "[Bug]: "
body:
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: Include Python version, OS, and a minimal reproducer. Omit secrets and private data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected versus actual behavior
    validations:
      required: true
