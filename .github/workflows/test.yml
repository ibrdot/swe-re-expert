name: skill-smoke-test

# Auto-trigger on push/PR is currently disabled because the GitHub account
# is on a billing hold — every push was failing at job-start with
# "The job was not started because your account is locked due to a billing
# issue." Once billing is resolved at https://github.com/settings/billing,
# uncomment the `push`/`pull_request` blocks below (or run manually via the
# Actions tab → "Run workflow" button) to re-enable CI.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  smoke-test-scripts:
    runs-on: ubuntu-latest
    name: Run bundled scripts (smoke test)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pefile pyelftools capstone
        continue-on-error: true

      - name: Smoke test re_triage.py on /bin/ls
        run: |
          python scripts/re_triage.py --file /bin/ls --all --out /tmp/ls_triage.json
          test -f /tmp/ls_triage.json
          python -c "import json; d=json.load(open('/tmp/ls_triage.json')); assert d['format']=='ELF'; assert d['arch']; print('re_triage OK')"

      - name: Smoke test re_disasm.py on /bin/ls
        run: |
          python scripts/re_disasm.py --file /bin/ls --functions --all --out /tmp/ls_disasm.json
          test -f /tmp/ls_disasm.json
          python -c "import json; d=json.load(open('/tmp/ls_disasm.json')); print('re_disasm OK')"

      - name: Smoke test swe_audit.py on scripts/
        run: |
          python scripts/swe_audit.py --root scripts --triage --out /tmp/swe_triage.json
          test -f /tmp/swe_triage.json
          python -c "import json; d=json.load(open('/tmp/swe_triage.json')); print('swe_audit OK')"

  syntax-check-prompts:
    runs-on: ubuntu-latest
    name: Validate skill structure
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          test -f SKILL.md
          test -f README.md
          test -f LICENSE
          test -f evals/evals.json
          test -d references/
          test -d prompts/
          test -d scripts/
          test -d assets/

      - name: SKILL.md frontmatter present
        run: |
          head -1 SKILL.md | grep "^---$"
          awk '/^---$/{c++; next} c==2{exit}' SKILL.md > /dev/null
          echo "Frontmatter OK"

      - name: evals.json valid JSON
        run: python -c "import json; json.load(open('evals/evals.json'))"

      - name: All scripts compile
        run: |
          python -m py_compile scripts/re_triage.py
          python -m py_compile scripts/re_disasm.py
          python -m py_compile scripts/swe_audit.py
          echo "All scripts compile"

      - name: All markdown files have non-trivial content
        run: |
          find . -name "*.md" -not -path "./.git/*" | while read f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 5 ]; then
              echo "ERROR: $f has only $lines lines"
              exit 1
            fi
          done
          echo "All markdown files have content"

      - name: No safety-preflight language (per skill constraint)
        run: |
          set -e
          if grep -rEni '(before you begin|ensure you have permission|verify legality|check local laws|obtain authorization|in your jurisdiction|use this responsibly|do no harm|exercise caution|with great power|first ensure|appropriate authorization)' . --include='*.md' --include='*.py' --include='*.json' --exclude-dir=.git; then
            echo "ERROR: skill files contain pre-flight safety language"
            exit 1
          fi
          echo "No safety-preflight language found"
