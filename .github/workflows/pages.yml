# Build and deploy explicitly selected protected-main or release-tag targets to GitHub Pages.
# Enable in repo: Settings → Pages → Source: GitHub Actions.
# Site URL: https://github.com/ibrdot/swe-re-expert/

name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Deploy the tested bytes for an exact released tag"
        required: true
        type: choice
        default: release
        options:
          - release

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployment provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Pages deployment requires an explicit workflow dispatch." >&2
            exit 1
          fi

          if [[ "${DEPLOYMENT_TARGET}" != "release" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual Pages deployment must be dispatched from an immutable release tag." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Pages deployment tag must match vX.Y.Z exactly: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          package_version="$(jq -r '.version // empty' package.json)"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Pages deployment tag ${GITHUB_REF_NAME} does not match package.json ${expected_tag}." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" || "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Pages deployment tag, checkout, and workflow SHA must resolve to the same commit." >&2
            exit 1
          fi

          release_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          if ! jq -e --arg tag "${GITHUB_REF_NAME}" \
            '.tag_name == $tag and .draft == false and (.published_at | type == "string" and length > 0)' \
            <<<"${release_json}" >/dev/null; then
            echo "Pages deployment requires a published, non-draft GitHub Release for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Fetch and verify tested immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/scripts/distribution_fetch.cjs "$RUNNER_TEMP/distribution"

      - name: Extract verified site bytes
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/distribution/site.tar" -C "$RUNNER_TEMP/site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
